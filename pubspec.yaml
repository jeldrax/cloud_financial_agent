name: cloud_financial_agent
description: >-
  Frontend multiplataforma Zero-Trust (Android y Linux Desktop) para Cloud Financial Agent
  basado en la regla presupuestal 50/30/20 con registro manual y asistido por IA.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Seguridad Local Continua (Biometría y credenciales del SO)
  local_auth: ^2.3.0
  # Protección Zero-Trust (Ofuscación binaria de variables de entorno .env)
  envied: ^1.1.1
  # Cliente HTTP para comunicación con FastAPI vía Tailscale
  http: ^1.2.2
  # Captura directa de voz manual (Android + Linux PipeWire/PulseAudio)
  record: ^7.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.1.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
