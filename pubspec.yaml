name: cloud_financial_agent
description: >-
  Frontend multiplataforma Zero-Trust (S23 Ultra, Galaxy Tab S7 FE y Linux CachyOS KDE)
  para Cloud Financial Agent (Hermes) basado en la regla presupuestal 50/30/20.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Seguridad Local Continua (Biometría y credenciales del SO)
  local_auth: ^2.3.0
  # Protección Zero-Trust (Ofuscación de variables de entorno .env)
  envied: ^1.1.1
  # Cliente HTTP para comunicación con FastAPI en TrueNAS vía Tailscale
  http: ^1.2.2
  # Captura directa de voz estilo MonAi (Android + Linux PipeWire/PulseAudio)
  record: ^7.1.2
  path_provider: ^2.1.5
  # Hashing SHA-256 para deduplicación de Webhooks (identificador_externo)
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.1.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
